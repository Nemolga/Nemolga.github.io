<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossverse: Bible Crossword</title>
<meta property="og:title" content="Crossverse: Bible Crossword">
<meta property="og:description" content="A new Bible crossword every day. Play alone, or race your friends.">
<style>
  :root { color-scheme: dark; --gold: #f2b84b; --ink: #3a2603; --cream: #fff4dc; --mist: #a9b4cc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden;
         background: linear-gradient(#0b1436, #070b1e 55%, #03050d); color: var(--cream);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }

  /* Slow light moving across the dark, like light on metal. */
  .light { position: fixed; inset: -30%; pointer-events: none; z-index: 0;
           background: radial-gradient(40% 35% at 30% 25%, #2a4bd766, transparent 70%),
                       radial-gradient(35% 30% at 75% 80%, #f2b84b1f, transparent 70%);
           animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-6%, -4%) rotate(0deg); } to { transform: translate(6%, 5%) rotate(8deg); } }

  /* Big letter tiles rising slowly behind everything. */
  .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaters span { position: absolute; bottom: -90px; width: 54px; height: 60px; border-radius: 13px; display: grid; place-items: center;
                   font-weight: 900; font-size: 28px; color: #f2b84b40; background: #ffffff08; border: 1.5px solid #f2b84b26;
                   animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(0) rotate(var(--r0)); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; }
                    to { transform: translateY(-120vh) rotate(var(--r1)); opacity: 0; } }

  main { position: relative; z-index: 1; padding: 32px 22px; max-width: 420px; width: 100%; }

  /* The heart from the app's icon: its tiles drop in one by one, then it beats. */
  .heart { display: grid; grid-template-columns: repeat(7, 14px); gap: 2px; justify-content: center; margin: 0 auto 16px;
           width: max-content; filter: drop-shadow(0 0 16px #f2b84b88); animation: beat 2.6s ease-in-out 2.2s infinite; }
  .heart i { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(#6480dc, #3a55b0);
             opacity: 0; animation: drop .55s cubic-bezier(.3, 1.6, .5, 1) forwards; }
  .heart i.g { background: linear-gradient(#ffe9a8, #f2b84b); }
  .heart i.o { visibility: hidden; }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 6% { transform: scale(1.08); } 12% { transform: scale(1); } 18% { transform: scale(1.05); } 24% { transform: scale(1); } }

  /* The name in gold foil, with a band of light that crosses it now and then. */
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 900; font-size: 44px; margin: 0 0 8px;
       background: linear-gradient(100deg, #dfa235 0%, #f6cf73 30%, #fff6d8 46%, #ffffff 50%, #fff6d8 54%, #f6cf73 70%, #dfa235 100%);
       background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent;
       opacity: 0; animation: fadeUp .7s ease-out 1.1s forwards, shine 7s ease-in-out 2s infinite; }
  @keyframes shine { 0%, 70% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  p { color: var(--mist); font-size: 17px; line-height: 1.5; margin: 8px 0; }
  .up { opacity: 0; animation: fadeUp .7s ease-out forwards; }

  /* A friend's code: gold tiles that drop into place. */
  .code { display: flex; gap: 8px; justify-content: center; margin: 18px 0 6px; }
  .code span { width: 48px; height: 54px; border-radius: 12px; background: linear-gradient(#ffe9a8, #f2b84b 55%, #d9972b);
               box-shadow: inset 0 2px 0 #fff3c4, 0 4px 0 #94600f, 0 10px 16px #0009; color: var(--ink); font-weight: 900; font-size: 25px;
               display: flex; align-items: center; justify-content: center; opacity: 0; animation: drop .6s cubic-bezier(.3, 1.6, .5, 1) forwards; }

  /* Buttons: raised gold with a band of light, they squeeze when pressed. */
  a.btn { position: relative; overflow: hidden; display: block; margin: 14px 0; padding: 17px; border-radius: 18px; text-decoration: none;
          font-weight: 800; font-size: 18px; letter-spacing: .02em; background: linear-gradient(#ffe9a8, #f2b84b 45%, #d9972b); color: var(--ink);
          box-shadow: inset 0 1.5px 0 #fff8dc, 0 3px 0 #94600f, 0 12px 28px #f2b84b44; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1);
          opacity: 0; animation: fadeUp .7s ease-out forwards; }
  a.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, #ffffffb0 50%, transparent 60%);
                 transform: translateX(-120%); animation: band 3.4s ease-in-out 2.6s infinite; }
  @keyframes band { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  a.btn:active { transform: scale(.95); }
  a.quiet { background: linear-gradient(#2a3a78, #18224e); color: var(--cream); box-shadow: 0 0 0 1.5px #7c8fd0 inset; }
  a.quiet::after { background: linear-gradient(105deg, transparent 40%, #ffffff30 50%, transparent 60%); }
  .soon { display: block; margin: 14px 0; padding: 16px; border-radius: 18px; border: 1.5px dashed #7c8fd0; color: var(--mist); font-size: 17px;
          opacity: 0; animation: fadeUp .7s ease-out forwards; }
  .hide { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; opacity: 1 !important; transition: none !important; }
    .floaters { display: none; }
  }
</style>
</head>
<body>
<div class="light"></div>
<div class="floaters" id="floaters"></div>
<main>
  <div class="heart" id="heart"></div>
  <h1>Crossverse</h1>
  <p id="lead" class="up" style="animation-delay:1.35s">A new Bible crossword every day. Play alone, or race your friends.</p>
  <div id="race" class="hide">
    <p id="label" class="up" style="animation-delay:1.5s">Your friend's race code</p>
    <div class="code" id="code"></div>
    <a class="btn" id="open" href="#">Open the race in Crossverse</a>
    <p id="help" class="up">Don't have the app yet? Get it below, open it, tap "Friends" and type the code.</p>
  </div>
  <div id="stores"></div>
</main>
<script>
  // The two store pages. Fill in APP_STORE once the app is on Apple's App Store; until then iPhones see "coming soon".
  var PLAY = "https://play.google.com/store/apps/details?id=com.crossverse.app";
  var APP_STORE = "";

  // The heart from the app's icon; its tiles drop in from the top row down.
  var n = 0;
  ["oBBoBBo", "BBBGBBB", "BBGGGBB", "oBBGBBo", "ooBGBoo", "oooGooo"].forEach(function (row, r) {
    for (var i = 0; i < row.length; i++) {
      var t = document.createElement("i");
      if (row[i] === "G") t.className = "g"; else if (row[i] === "o") t.className = "o";
      t.style.animationDelay = (0.15 + r * 0.12 + i * 0.03) + "s";
      document.getElementById("heart").appendChild(t);
    }
  });

  // Letter tiles drifting up behind the page: the letters of CROSS and VERSE.
  var letters = "CROSSVERSE", fl = document.getElementById("floaters");
  for (var k = 0; k < letters.length; k++) {
    var s = document.createElement("span");
    s.textContent = letters[k];
    s.style.left = (4 + (k * 9.7) % 92) + "%";
    s.style.animationDuration = (16 + (k * 7) % 11) + "s";
    s.style.animationDelay = (-(k * 3.3) % 20) + "s";
    s.style.setProperty("--r0", ((k % 3) - 1) * 12 + "deg");
    s.style.setProperty("--r1", (((k + 1) % 3) - 1) * 24 + "deg");
    fl.appendChild(s);
  }

  // A race code travels as ?race=ABC23, a friend code as ?friend=ABC234. Nothing is sent anywhere: this page only shows it.
  var m = /[?&]race=([2-9A-HJKMNP-Za-hjkmnp-z]{5})(?:&|$)/.exec(location.search);
  var f = /[?&]friend=([2-9A-HJKMNP-Za-hjkmnp-z]{6})(?:&|$)/.exec(location.search);
  var kind = m ? "race" : (f ? "friend" : null);
  // A crossword challenge travels as ?k=CODE&t=seconds&m=misses&n=name.
  var challenge = !kind && /[?&]k=[2-9A-HJKMNP-Za-hjkmnp-z-]{16,30}(?:&|$)/.test(location.search);
  var playLink = PLAY;
  var next = 1.6;  // when the next part of the page arrives, in seconds
  if (challenge) {
    var query = location.search.slice(1);
    var who = (/[?&]n=([^&]*)/.exec(location.search) || [])[1];
    who = who ? decodeURIComponent(who.replace(/\+/g, " ")).replace(/[^A-Za-zÀ-ÿ ]/g, "").slice(0, 14) : "";
    document.getElementById("lead").textContent = (who ? who + " challenged" : "A friend challenged") + " you to a Bible crossword!";
    var open = document.createElement("a");
    open.className = "btn"; open.href = "crossverse://play?" + query; open.textContent = "Open the crossword in Crossverse";
    open.style.animationDelay = next + "s"; next += 0.25;
    document.getElementById("stores").before(open);
    playLink = PLAY + "&referrer=" + encodeURIComponent(query);
  }
  if (kind) {
    var code = (m || f)[1].toUpperCase();
    if (kind === "race") {
      document.getElementById("lead").textContent = "You've been invited to a race!";
    } else {
      document.getElementById("lead").textContent = "A friend wants to add you in Crossverse!";
      document.getElementById("label").textContent = "Your friend's code";
      document.getElementById("open").textContent = "Add my friend in Crossverse";
    }
    document.getElementById("race").className = "";
    var box = document.getElementById("code");
    for (var i = 0; i < code.length; i++) {
      var c = document.createElement("span");
      c.textContent = code[i];
      c.style.animationDelay = (1.7 + i * 0.12) + "s";
      box.appendChild(c);
    }
    next = 1.8 + code.length * 0.12;
    document.getElementById("open").style.animationDelay = next + "s";
    document.getElementById("help").style.animationDelay = (next + 0.15) + "s";
    next += 0.3;
    document.getElementById("open").href = "crossverse://play?" + kind + "=" + code;
    // Installed from this link, the app opens the race or the friend by itself.
    playLink = PLAY + "&referrer=" + encodeURIComponent(kind + "=" + code);
  }

  // One link for everyone: the right store for the phone that opened it.
  var ua = navigator.userAgent || "";
  var apple = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var stores = document.getElementById("stores");
  function button(text, href, quiet) {
    var a = document.createElement("a");
    a.className = "btn" + (quiet ? " quiet" : "");
    a.href = href; a.textContent = text;
    a.style.animationDelay = next + "s"; next += 0.12;
    stores.appendChild(a);
  }
  function soon() {
    var d = document.createElement("div");
    d.className = "soon"; d.textContent = "Coming soon to the App Store";
    d.style.animationDelay = next + "s"; next += 0.12;
    stores.appendChild(d);
  }
  var q = !!kind || challenge;
  if (apple) { if (APP_STORE) button("Get it on the App Store", APP_STORE, q); else soon(); }
  else if (android) { button("Get it on Google Play", playLink, q); }
  else {
    button("Get it on Google Play", playLink, true);
    if (APP_STORE) button("Get it on the App Store", APP_STORE, true); else soon();
  }
</script>
</body>
</html>
